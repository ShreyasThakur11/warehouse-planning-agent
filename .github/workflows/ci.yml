name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Lint
        run: |
          python -m ruff check src tests scripts
          python -m ruff format --check src tests scripts
      - name: Type-check
        run: python -m mypy src
      - name: Test
        run: python -m pytest
      - name: House style and published figures
        run: |
          python scripts/check_prose.py
          python scripts/check_facts.py

  replay:
    name: Replay matches the evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: python -m pip install -e .
      - name: Plan every day and build the dashboard
        run: warehouse-planner site
      - name: Hold the dashboard to the published evidence
        continue-on-error: true
        run: python scripts/check_replay.py
