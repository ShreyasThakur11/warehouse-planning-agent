name: Dashboard

# Builds the dashboard and publishes it to GitHub Pages. The page works out which replay
# day to show from the date, so it moves on each day by itself. The daily run matters only
# when an Anthropic key is set: then Claude re-plans that day before it is published.
on:
  push:
    branches: [main]
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and check the dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - name: Decide whether there is anything new to publish
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$EVENT" = "schedule" ] && [ "$HAS_KEY" != "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No Anthropic key is set, so the daily run has nothing new to publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.publish == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.publish == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.publish == 'true'
        with:
          node-version: "22"
      - name: Install
        if: steps.gate.outputs.publish == 'true'
        run: |
          python -m pip install -e ".[claude]"
          npm install --prefix scripts --no-audit --no-fund
      - name: Plan every day and build the dashboard
        if: steps.gate.outputs.publish == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: warehouse-planner site --claude-today
      - name: Open every page in a browser
        if: steps.gate.outputs.publish == 'true'
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/check_site.mjs _site
      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.publish == 'true'
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
